<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Hello LB6500</title>
<style>body{background:#101820;color:#fff;font-family:sans-serif;font-size:26px;margin:40px}h1{font-size:44px}pre{white-space:pre-wrap}</style></head>
<body><h1>Hello, LG 47LB6500</h1><pre id="out">carregando...</pre>
<script>
var out=[];
function add(k,v){out.push(k+': '+v);}
add('userAgent',navigator.userAgent);
add('tela',window.innerWidth+'x'+window.innerHeight);
add('fetch',typeof window.fetch);
add('Promise',typeof window.Promise);
add('WebSocket',typeof window.WebSocket);
add('localStorage',typeof window.localStorage);
add('MediaSource',typeof window.MediaSource);
add('canvas',!!document.createElement('canvas').getContext);
var v=document.createElement('video');
var types=['video/mp4; codecs="avc1.42E01E"','video/mp4; codecs="avc1.640028"','video/webm; codecs="vp8"','video/webm; codecs="vp9"','video/mp4; codecs="hev1.1.6.L93.B0"','application/vnd.apple.mpegurl','audio/mpeg','audio/mp4; codecs="mp4a.40.2"'];
for(var i=0;i<types.length;i++){add(types[i],v.canPlayType?(v.canPlayType(types[i])||'(nao)'):'sem suporte');}
document.getElementById('out').textContent=out.join('\n');
</script></body></html>
